plugins { id 'com.android.application' }
android {
    namespace 'dev.rewindamp'
    buildFeatures { buildConfig true }
    compileSdk 35
    defaultConfig {
        applicationId 'dev.rewindamp'
        minSdk 26
        targetSdk 35
        versionCode 24
        versionName '0.4.13'
        testInstrumentationRunner 'androidx.test.runner.AndroidJUnitRunner'
    }
    // CI injects the existing certificate; local builds retain the host's debug key.
    signingConfigs {
        debug {
            if (System.getenv('ANDROID_KEYSTORE_PATH')) {
                storeFile file(System.getenv('ANDROID_KEYSTORE_PATH'))
                storePassword System.getenv('ANDROID_KEYSTORE_PASSWORD')
                keyAlias System.getenv('ANDROID_KEY_ALIAS')
                keyPassword System.getenv('ANDROID_KEY_PASSWORD')
            }
        }
    }
    compileOptions { coreLibraryDesugaringEnabled true; sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
}
dependencies {
    coreLibraryDesugaring 'com.android.tools:desugar_jdk_libs:2.1.5'
    implementation 'androidx.media3:media3-exoplayer:1.8.0'
    implementation 'androidx.media3:media3-session:1.8.0'
    implementation 'androidx.media3:media3-database:1.8.0'
    implementation 'androidx.media3:media3-ui:1.8.0'
    implementation 'androidx.core:core:1.15.0'
    androidTestImplementation 'androidx.test:runner:1.6.2'
    androidTestImplementation 'androidx.test.ext:junit:1.2.1'
}
